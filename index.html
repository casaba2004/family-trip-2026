<html lang="ko">
<head>
<meta charset="UTF-8">

<title>칠순기념 강원도 가족여행 일정표</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ink:#1c2530; --sub:#9a8f7c; --paper:#f6f1e7; --line:#e9e0cf; --card:#fffdf9;
  --day1:#bd5b3d; --day2:#1f6f68; --day3:#4a4f8c;
  --tour:#1f6f68; --tour-bg:#e2efec;
  --meal:#c66038; --meal-bg:#f7e9df;
  --stay:#6b4f8f; --stay-bg:#ece3f2;
  --move:#a9855a; --move-bg:#f3ead9;
  --gold:#c79a52;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:#0e1116; color:var(--ink);
  display:flex; justify-content:center;
}
h1,h2,.serif{font-family:'Noto Serif KR','Pretendard',serif;}
#app{
  width:100%; max-width:430px; height:100vh; height:100dvh;
  background:var(--paper); position:relative; overflow:hidden;
  display:flex; flex-direction:column;
  box-shadow:0 0 40px rgba(0,0,0,.5);
}

/* 헤더 */
header{
  padding:7px 14px 6px; background:var(--ink); flex:0 0 auto;
  border-top:2px solid var(--gold);
  display:flex; justify-content:space-between; align-items:center; gap:8px;
}
header .titles{flex:1 1 auto; min-width:0;}
header .titles h1{margin:0; font-size:18px; font-weight:800; letter-spacing:-0.01em; color:#fbf7ee; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
header .meta{
  font-size:10.5px; color:rgba(251,247,238,.6); margin-top:2px; font-weight:600;
  letter-spacing:-0.03em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.copyBtn{
  flex:0 0 auto; background:rgba(251,247,238,.1); border:1px solid rgba(251,247,238,.28);
  color:#fbf7ee; font-size:11.5px; font-weight:700; padding:7px 10px; border-radius:20px; cursor:pointer;
  white-space:nowrap;
}
.copyBtn:active{background:rgba(251,247,238,.22);}

/* 탭 */
.tabs{display:flex; gap:9px; background:var(--ink); flex:0 0 auto; padding:6px 14px 10px;}
.tab{
  flex:1; text-align:center; padding:10px 4px 9px; position:relative;
  font-size:15px; font-weight:800; border:1.5px solid transparent; border-radius:15px;
  cursor:pointer; transition:transform .15s, background .15s, box-shadow .15s, color .15s, border-color .15s;
}
.tab:active{transform:scale(.95);}
.tab .d{display:block; font-size:10.5px; font-weight:700; margin-top:3px; letter-spacing:.01em; opacity:.9;}
#tab1{background:rgba(189,91,61,.22); color:#f3c6b3; border-color:rgba(189,91,61,.5);}
#tab2{background:rgba(31,111,104,.22); color:#aee0da; border-color:rgba(31,111,104,.5);}
#tab3{background:rgba(74,79,140,.22); color:#c6c9ee; border-color:rgba(74,79,140,.5);}
#tab1.active{background:var(--day1); border-color:var(--day1); color:#fff; transform:scale(1.06); box-shadow:0 6px 16px rgba(189,91,61,.55);}
#tab2.active{background:var(--day2); border-color:var(--day2); color:#fff; transform:scale(1.06); box-shadow:0 6px 16px rgba(31,111,104,.55);}
#tab3.active{background:var(--day3); border-color:var(--day3); color:#fff; transform:scale(1.06); box-shadow:0 6px 16px rgba(74,79,140,.55);}
.tab.active .d{opacity:.95;}

/* 지도 (실제 Leaflet 지도) */
.mapwrap{position:relative; flex:0 0 190px; height:190px; width:100%; border-bottom:1px solid var(--line); background:#eef1ea;}
#leafletMap{width:100%; height:100%;}
.map-badge{
  position:absolute; top:8px; left:8px; z-index:500;
  background:rgba(255,255,255,.95); padding:5px 11px; border-radius:20px;
  font-size:12px; font-weight:800; box-shadow:0 2px 6px rgba(0,0,0,.15); color:var(--ink);
}
.map-hint{
  position:absolute; bottom:8px; right:8px; z-index:500; font-size:11.5px; color:var(--ink); font-weight:700;
  background:rgba(255,255,255,.92); padding:6px 11px; border-radius:20px; border:none; box-shadow:0 2px 6px rgba(0,0,0,.12);
  cursor:pointer;
}
.pin-wrap{display:flex; align-items:center; justify-content:center;}
.pin{
  width:24px; height:24px; border-radius:50% 50% 50% 0; transform:rotate(45deg);
  display:flex; align-items:center; justify-content:center; box-shadow:0 2px 5px rgba(0,0,0,.3);
  border:2px solid #fff;
}
.pin span{transform:rotate(-45deg); font-size:10.5px; font-weight:800; color:#fff;}
.pin.active{width:30px; height:30px; box-shadow:0 0 0 4px rgba(229,62,62,.35), 0 2px 6px rgba(0,0,0,.35); z-index:1000 !important;}
.opt-pin{width:11px; height:11px; border-radius:50%; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.3); opacity:.85;}

/* 타임라인 */
.list{flex:1; min-height:0; overflow-y:auto; padding:8px 10px 12px; -webkit-overflow-scrolling:touch;}

.moveline{
  display:flex; align-items:center; gap:6px; margin:1px 0 6px 12px;
  font-size:12.5px; font-weight:700; color:var(--move);
}
.moveline::before{content:''; width:1px; height:14px; background:var(--line); margin-right:2px;}

/* 출발 정보 카드 */
.departrow{display:flex; gap:6px; margin-bottom:7px;}
.depart-card{
  flex:1; background:var(--card); border-radius:15px; padding:8px 10px;
  position:relative; overflow:hidden; box-shadow:0 2px 10px rgba(28,37,48,.06);
}
.depart-card::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px;}
.depart-card.geoje::before{background:var(--day1);}
.depart-card.pt::before{background:var(--day2);}
.depart-card .team{font-size:12.5px; font-weight:800; color:var(--sub); margin-bottom:2px;}
.depart-card .go{font-size:13px; color:var(--sub); font-weight:600; margin-bottom:1px;}
.depart-card .clock{font-size:23px; font-weight:900; letter-spacing:-0.02em; margin-bottom:2px;}
.depart-card .stat{font-size:12.5px; color:var(--sub); line-height:1.55;}
.depart-card .note{font-size:11.5px; color:var(--gold); margin-top:2px; font-weight:700;}

.card{
  position:relative; display:flex; gap:10px; background:var(--card);
  border-radius:18px; padding:10px; margin-bottom:7px;
  box-shadow:0 3px 14px rgba(28,37,48,.07);
  cursor:pointer;
}
.card:active{background:#f4ecdb;}
.card.hl{box-shadow:0 0 0 1.5px var(--gold), 0 6px 18px rgba(28,37,48,.14);}
.card .num{
  flex:0 0 auto; width:26px; padding-top:1px; text-align:center;
  font-family:'Noto Serif KR',serif; font-size:17px; font-weight:600; color:var(--sub); position:relative;
}
.card .num::after{content:''; position:absolute; left:50%; bottom:-6px; transform:translateX(-50%); width:3px; height:3px; border-radius:50%;}
.card.cat-tour .num{color:var(--tour);} .card.cat-tour .num::after{background:var(--tour);}
.card.cat-meal .num{color:var(--meal);} .card.cat-meal .num::after{background:var(--meal);}
.card.cat-stay .num{color:var(--stay);} .card.cat-stay .num::after{background:var(--stay);}
.card .cbody{flex:1; min-width:0;}
.card .toprow{display:flex; align-items:center; gap:7px; margin-bottom:3px;}
.tag{font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;}
.cat-tour .tag{color:var(--tour);}
.cat-meal .tag{color:var(--meal);}
.cat-stay .tag{color:var(--stay);}
.card .time{font-size:12.5px; font-weight:800; padding:4px 9px; border-radius:8px; background:var(--line); color:var(--ink); white-space:nowrap;}
.cat-tour .time{background:var(--tour-bg); color:var(--tour);}
.cat-meal .time{background:var(--meal-bg); color:var(--meal);}
.cat-stay .time{background:var(--stay-bg); color:var(--stay);}
.card .ctitle{font-family:'Noto Serif KR',serif; font-size:17.5px; font-weight:700; line-height:1.42; color:var(--ink);}
.card .csub{font-size:13.5px; color:var(--sub); margin-top:3px; line-height:1.45;}
.card .zoom{
  margin-left:auto; flex:0 0 auto; display:flex; align-items:center; gap:3px;
  padding:6px 12px; border-radius:20px;
  background:var(--gold); border:1px solid var(--gold); font-size:11.5px; font-weight:800; color:#fff; white-space:nowrap;
  box-shadow:0 2px 6px rgba(199,154,82,.35);
}

/* 식사 선택 칩 */
.optrow{display:flex; gap:7px; overflow-x:auto; margin-top:5px; padding-bottom:1px; scrollbar-width:none;}
.optrow::-webkit-scrollbar{display:none;}
.opt{
  flex:0 0 auto; width:198px; padding:10px 11px 9px; border:none;
  border-radius:14px; background:var(--paper); cursor:pointer; box-shadow:inset 0 0 0 1px rgba(28,37,48,.05);
  overflow:hidden; text-align:left;
}
.meal-thumb{position:relative;height:92px;margin:-10px -11px 9px;background:#ddd;overflow:hidden;}
.meal-thumb img{display:block;width:100%;height:100%;object-fit:cover;}
.meal-thumb span{position:absolute;right:7px;bottom:6px;padding:3px 7px;border-radius:12px;background:rgba(28,37,48,.72);color:#fff;font-size:10px;font-weight:800;}
.opt .oname{font-size:13.5px; font-weight:800; line-height:1.3; color:var(--ink);}
.opt .orate{font-size:11.5px; color:var(--gold); font-weight:800; margin-top:3px;}
.opt .omenu{font-size:12px; color:var(--ink); font-weight:700; margin-top:7px; line-height:1.4;}
.opt .omenu .lbl{color:var(--sub); font-weight:600; margin-right:3px;}
.opt .oprice{font-size:11.5px; color:var(--meal); font-weight:700; margin-top:3px;}
.opt .oreason{
  font-size:11px; color:var(--sub); line-height:1.45; margin-top:6px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.opt .obottom{display:flex; align-items:center; justify-content:flex-end; margin-top:5px; gap:4px;}
.opt .ozoom{
  flex:0 0 auto; display:flex; align-items:center; gap:2px; padding:5px 10px; border-radius:20px;
  background:#fff; border:1px solid var(--line); font-size:10.5px; font-weight:700; color:var(--ink);
}

/* 상세 팝업 시트 */
.overlay{
  position:absolute; inset:0; background:rgba(20,17,12,.5); z-index:2000;
  display:none; align-items:flex-end; justify-content:center;
}
.overlay.show{display:flex;}
.sheet{
  width:100%; max-height:82%; background:#fff; border-radius:20px 20px 0 0;
  overflow:hidden; padding:0; animation:up .2s ease-out; position:relative;
  display:flex; flex-direction:column;
}
.sheetHead{
  position:relative; z-index:6; flex:0 0 auto; padding:4px 14px 7px;
  background:#fff; box-shadow:0 7px 12px -11px rgba(37,52,75,.7);
}
#sheetBody{min-height:0;overflow-y:auto;padding:0 14px 14px;-webkit-overflow-scrolling:touch;}
@keyframes up{from{transform:translateY(20px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet .handle{width:36px; height:4px; background:var(--line); border-radius:4px; margin:6px auto 8px;}
.sheet h2{margin:0 42px 3px 0; font-size:22px; font-weight:800; font-family:'Noto Serif KR',serif;}
.sheet .badgeRow{display:flex; gap:6px; align-items:center; margin-bottom:8px; flex-wrap:wrap;}
.pill{font-size:12.5px; font-weight:800; padding:4px 10px; border-radius:20px; color:#fff;}
.pill.rate{background:var(--gold);}
.pill.price{background:var(--ink);}
.sheet .desc{font-size:15px; line-height:1.5; color:#4a453e; margin-bottom:9px;}
.sheet .kv{display:flex; font-size:14px; padding:5px 0; border-top:1px solid var(--line);}
.sheet .kv:first-of-type{border-top:none;}
.sheet .kv .k{width:70px; flex:0 0 auto; color:var(--sub); font-weight:700;}
.sheet .kv .v{flex:1; font-weight:600;}
.sheet .reason{
  margin-top:8px; padding:9px 11px; background:#f7f3ea; border-radius:12px;
  font-size:14px; line-height:1.62; color:#5a5347;
}
.sheet .reason b{color:var(--ink);}
.sheet .gmap{
  display:block; text-align:center; margin-top:10px; padding:10px; border-radius:12px;
  background:#fff; color:var(--ink); font-weight:700; font-size:14.5px; text-decoration:none;
  border:1.5px solid var(--line);
}
.sheet .confirmBtn{
  display:block; width:100%; text-align:center; margin-top:7px; padding:11px; border-radius:12px;
  background:var(--ink); color:#fff; font-weight:800; font-size:15px; border:none;
}
.closeBtn{
  position:absolute; top:10px; right:12px; z-index:5; width:36px; height:36px; border-radius:50%;
  background:#f2ede2; border:1px solid var(--line); font-size:18px; font-weight:800; color:var(--ink);
  box-shadow:0 2px 7px rgba(28,37,48,.14); cursor:pointer;
}

/* 관광지 상세 사진 */
.tour-gallery{margin:8px 0 9px;min-width:0;}
.tour-gallery-stage{position:relative;}
.tour-gallery-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;border-radius:12px;}
.tour-gallery-track::-webkit-scrollbar{display:none;}
.tour-gallery-slide{flex:0 0 100%;min-width:0;margin:0;scroll-snap-align:start;scroll-snap-stop:always;}
.tour-gallery-image{display:flex;align-items:center;justify-content:center;width:100%;height:clamp(150px,27vh,220px);background:#141b24;}
.tour-gallery-image img{display:block;width:100%;height:100%;object-fit:contain;}
.tour-gallery-error{padding:20px;color:#fff;font-size:13px;line-height:1.6;text-align:center;}
.tour-gallery-slide figcaption{padding:5px 2px 0;font-size:12px;line-height:1.4;font-weight:600;color:var(--ink);}
.tour-gallery-nav{position:absolute;top:calc(clamp(150px,27vh,220px)/2);z-index:3;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border:1px solid rgba(255,255,255,.55);border-radius:50%;background:rgba(20,27,36,.68);color:#fff;font:inherit;font-size:25px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer;touch-action:manipulation;}
.tour-gallery-prev{left:7px;}
.tour-gallery-next{right:7px;}
.tour-gallery-nav:focus-visible,.tour-gallery-track:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.tour-gallery-count{position:absolute;top:8px;right:8px;z-index:3;min-width:42px;padding:3px 7px;border-radius:12px;background:rgba(20,27,36,.68);color:#fff;text-align:center;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;}
.tour-gallery-hint{margin:4px 0 0;font-size:11px;line-height:1.4;color:#746c60;text-align:center;}
.tour-gallery-credits{margin-top:8px;font-size:11px;line-height:1.6;color:#746c60;overflow-wrap:anywhere;}
.tour-gallery-credits summary{cursor:pointer;padding:5px 0;}
.tour-gallery-credits ol{padding-left:20px;margin:4px 0;}
.tour-gallery-credits li+li{margin-top:8px;}
.tour-gallery-credits a{color:#1f6f68;text-underline-offset:2px;}
.meal-detail-photo{margin:8px 0 10px;}
.meal-detail-photo img{display:block;width:100%;height:clamp(170px,29vh,235px);object-fit:contain;border-radius:12px;background:#141b24;}
.meal-detail-photo figcaption{padding:5px 2px 0;font-size:11px;line-height:1.45;color:#746c60;}
.meal-detail-photo a{color:#1f6f68;text-underline-offset:2px;}

/* 토스트 (복사 완료 알림) */
.toast{
  position:absolute; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:#fbf7ee; font-size:14px; font-weight:700;
  padding:10px 18px; border-radius:30px; box-shadow:0 6px 18px rgba(0,0,0,.3);
  z-index:3000; opacity:0; pointer-events:none; transition:.25s;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* 톤 미리보기: 레이아웃과 버튼 위치는 유지하고 색상만 밝게 변경 */
:root{
  --ink:#25344b; --sub:#68778a; --paper:#f4f9fb; --line:#dce7ed; --card:#ffffff;
  --day1:#ff736b; --day2:#17a89b; --day3:#786ee6;
  --tour:#128d83; --tour-bg:#dcf6f2;
  --meal:#e9674d; --meal-bg:#ffede7;
  --stay:#765fd3; --stay-bg:#eeeaff;
  --move:#658299; --move-bg:#eaf2f6;
  --gold:#f2a63b;
}
body{background:#e4eef3;}
#app{box-shadow:0 0 40px rgba(37,52,75,.18);}
header{
  background:linear-gradient(135deg,#356aa6 0%,#238f87 100%);
  border-top-color:#83d9d1;
  box-shadow:0 3px 14px rgba(32,75,105,.22);
}
header .titles h1{
  color:#fff8ee; font-size:18px; font-weight:800; letter-spacing:-.01em;
  text-shadow:0 2px 4px rgba(15,55,76,.30);
}
header .meta{color:rgba(255,255,255,.86);}
.copyBtn{background:rgba(255,255,255,.94);border-color:rgba(255,255,255,.72);color:#245575;box-shadow:0 2px 9px rgba(23,77,108,.16);}
.copyBtn:active{background:#e9fbfa;}
.tabs{background:linear-gradient(135deg,#effbff 0%,#f7f3ff 100%);}
#tab1{background:#fff0ed;color:#cc4944;border-color:#ffc4bf;}
#tab2{background:#e8f8f6;color:#087c73;border-color:#a9e3de;}
#tab3{background:#efedff;color:#5d54bf;border-color:#c8c2ff;}
#tab1.active{box-shadow:0 6px 16px rgba(255,115,107,.32);}
#tab2.active{box-shadow:0 6px 16px rgba(23,168,155,.30);}
#tab3.active{box-shadow:0 6px 16px rgba(120,110,230,.30);}
.mapwrap{background:#e8f4f2;}
.map-badge,.map-hint{box-shadow:0 3px 10px rgba(37,52,75,.14);}
.depart-card,.card{box-shadow:0 4px 16px rgba(63,91,112,.09);}
.card:active{background:#edf7fa;}
.card.hl{box-shadow:0 0 0 1.5px var(--gold),0 7px 20px rgba(63,91,112,.15);}
.card .zoom{background:var(--gold);border-color:var(--gold);color:#4b3210;box-shadow:0 3px 9px rgba(242,166,59,.28);}
.opt{background:#f3f8fa;box-shadow:inset 0 0 0 1px rgba(72,105,128,.10);}
.opt .ozoom{background:#fff;border-color:#d4e1e8;color:#31455e;}
.overlay{background:rgba(28,43,60,.46);}
.sheet .reason{background:#f2f7fa;color:#526478;}
.closeBtn{background:#eff6f8;border-color:#d5e2e8;}
.sheet .confirmBtn{background:#253f5c;}
.toast{background:#253f5c;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="titles">
      <h1>칠순기념 강원도 가족여행 일정표</h1>
      <div class="meta">2026.10.3(토)~10.5(월) · 양양 송시재 2박 · 거제 5명 + 평택 4명</div>
    </div>
    <button class="copyBtn" onclick="copySchedule()">📋 일정복사</button>
  </header>

  <div class="tabs">
    <button class="tab active" id="tab1" onclick="showDay(1)">1일차<span class="d">속초·낙산사</span></button>
    <button class="tab" id="tab2" onclick="showDay(2)">2일차<span class="d">설악산·강릉</span></button>
    <button class="tab" id="tab3" onclick="showDay(3)">3일차<span class="d">발왕산·해산</span></button>
  </div>

  <div class="mapwrap">
    <div id="leafletMap"></div>
    <div class="map-badge" id="mapBadge">🗺 1일차 전체 동선</div>
    <button class="map-hint" onclick="resetMapView()">↺ 전체보기</button>
  </div>

  <div class="list" id="list"></div>

  <div class="overlay" id="overlay" onclick="if(event.target.id==='overlay')closeSheet()">
    <div class="sheet">
      <div class="sheetHead">
        <div class="handle"></div>
        <h2 id="sheetTitle"></h2>
        <button class="closeBtn" onclick="closeSheet()">✕</button>
      </div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

      {name:'산촌식당', lat:37.7162,lng:128.6018, rate:'4.1', reviews:323, phone:'033-333-7975', addr:'평창군 진부면 동산리 332-1', menu:'산채정식', price:'1인 13,000~29,000원', reason:'반찬 13가지 이상으로 채식주의자도 만족한다는 후기. 일부 리뷰 관련 불만 후기 참고 필요.'},
    ]},
  {t:'move', title:'진부 → 거제/평택', note:'약 315km / 145km · 각자 귀가'},
  {t:'event', cat:'stay', time:'식사 후', icon:'🚗', title:'해산, 각자 귀가', sub:'2박 3일 여행 종료', detail:{desc:'2박 3일 가족여행 종료. 거제팀·평택팀 각자 귀가합니다.', reason:'즐거운 여행 되시길 바랍니다!'}},
]
};

/* ===================== 상태 ===================== */
let currentDay = 1;
let map = null;
let markersLayer = null;
const markerRefs = {}; // key -> leaflet marker
const idToItem = {};

function buildDetailKey(day, iIdx, oIdx){ return day+'_'+iIdx+'_'+(oIdx===undefined?'x':oIdx); }

/* ===================== 카드 리스트 렌더링 (1번 로직 그대로) ===================== */
function renderDay(day){
  const list = document.getElementById('list');
  const items = DATA[day];
  let html = ''; let num = 0;
  let departBuf = [];
  function flushDepart(){
    if(!departBuf.length) return;
    html += '<div class="departrow">';
    departBuf.forEach(d=>{
      const cls = d.team.includes('거제') ? 'geoje' : 'pt';
      html += `<div class="depart-card ${cls}">
        <div class="team">🚙 ${d.team} 출발</div>
        <div class="clock">${d.time}</div>
        <div class="stat">${d.dist} · ${d.dur}</div>
        <div class="note">${d.note}</div>
      </div>`;
    });
    html += '</div>';
    departBuf = [];
  }
  items.forEach((item, iIdx)=>{
    if(item.t==='depart'){ departBuf.push(item); return; }
    flushDepart();
    if(item.t==='move'){
      html += `<div class="moveline">🚗 이동 · ${item.title.split('→')[1]||item.title} ${item.note?('('+item.note+')'):''}</div>`;
      return;
    }
    num++;
    const key = buildDetailKey(day, iIdx);
    idToItem[key] = {kind:'item', day, iIdx};
    html += `
      <div class="card cat-${item.cat}" id="row_${key}" onclick="onItemClick('${key}')">
        <div class="num">${num}</div>
        <div class="cbody">
          <div class="toprow">
            <span class="tag">${CATLABEL[item.cat]}</span>
            <span class="time">${item.time}</span>
            ${item.detail?`<span class="zoom" onclick="event.stopPropagation();openSheet('${key}')">🔍 상세보기</span>`:''}
          </div>
          <div class="ctitle">${item.icon||''} ${item.title}</div>
          ${item.sub?`<div class="csub">${item.sub}</div>`:''}
          ${item.options?renderOpts(day, iIdx, item.options):''}
        </div>
      </div>
    `;
  });
  flushDepart();
  list.innerHTML = html;
}

function renderOpts(day, iIdx, options){
  let h = '<div class="optrow">';
  options.forEach((opt, oIdx)=>{
    const key = buildDetailKey(day, iIdx, oIdx);
    idToItem[key] = {kind:'opt', day, iIdx, oIdx};
    h += `
      <div class="opt" onclick="event.stopPropagation();onOptClick('${key}')">
        ${renderMealThumb(opt.name)}
        <div class="oname">${oIdx+1}. ${opt.name}</div>
        <div class="orate">${opt.rate!=='-'?'★ '+opt.rate+(opt.reviews?(' ('+opt.reviews.toLocaleString()+')'):''):'평점 정보없음'}</div>
        ${opt.menu?`<div class="omenu"><span class="lbl">메뉴</span>${opt.menu}</div>`:''}
        ${opt.price&&opt.price!=='-'?`<div class="oprice">${opt.price}</div>`:''}
        ${opt.reason?`<div class="oreason">${opt.reason}</div>`:''}
      </div>
    `;
  });
  return h + '</div>';
}

function onItemClick(key){
  const ref = idToItem[key];
  highlightRow(key);
  const item = DATA[ref.day][ref.iIdx];
  if(item.lat) focusMarker(key);
}
function onOptClick(key){
  const ref = idToItem[key];
  const opt = DATA[ref.day][ref.iIdx].options[ref.oIdx];
  if(opt.lat) focusMarker(key);
  openSheet(key);
}
function highlightRow(key){
  document.querySelectorAll('.card.hl').forEach(r=>r.classList.remove('hl'));
  const el = document.getElementById('row_'+key);
  if(el) el.classList.add('hl');
}

/* ===================== 실제 지도 (Leaflet + OpenStreetMap) ===================== */
function initLeaflet(){
  map = L.map('leafletMap', { zoomControl:false, attributionControl:false }).setView([38.1,128.6], 9);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:18 }).addTo(map);
  markersLayer = L.layerGroup().addTo(map);
}

function makeIcon(colorHex, label, small){
  if(small){
    return L.divIcon({
      className:'', html:`<div class="opt-pin" style="background:${colorHex}"></div>`,
      iconSize:[11,11], iconAnchor:[5,5]
    });
  }
  return L.divIcon({
    className:'', html:`<div class="pin-wrap"><div class="pin" style="background:${colorHex}"><span>${label}</span></div></div>`,
    iconSize:[24,24], iconAnchor:[12,22]
  });
}

function buildMap(day){
  document.getElementById('mapBadge').textContent = '🗺 ' + DAYNAME[day];
  markersLayer.clearLayers();
  Object.keys(markerRefs).forEach(k=>delete markerRefs[k]);

  const items = DATA[day];
  const mainPts = [];
  const optPts = [];
  items.forEach((item, iIdx)=>{
    if(item.lat){ mainPts.push({lat:item.lat,lng:item.lng,key:buildDetailKey(day,iIdx),cat:item.cat}); }
    if(item.options) item.options.forEach((opt,oIdx)=>{
      if(opt.lat) optPts.push({lat:opt.lat,lng:opt.lng,key:buildDetailKey(day,iIdx,oIdx)});
    });
  });

  if(mainPts.length===0){ return; }

  // 이동경로 선
  const latlngs = mainPts.map(p=>[p.lat,p.lng]);
  if(latlngs.length>1){
    L.polyline(latlngs, {color:DAYCOLOR[day], weight:3, opacity:.75, dashArray:'2,8'}).addTo(markersLayer);
  }

  // 후보(옵션) 작은 점
  optPts.forEach(p=>{
    const m = L.marker([p.lat,p.lng], {icon: makeIcon('#a9855a', '', true)}).addTo(markersLayer);
    m.on('click', ()=>onMarkerClick(p.key));
    markerRefs[p.key] = m;
  });

  // 메인 지점 번호 핀
  mainPts.forEach((p,i)=>{
    const m = L.marker([p.lat,p.lng], {icon: makeIcon(CATCOLOR[p.cat]||'#1f6f68', i+1, false)}).addTo(markersLayer);
    m.on('click', ()=>onMarkerClick(p.key));
    markerRefs[p.key] = m;
  });

  setTimeout(()=>{ map.invalidateSize(); fitToDay(day); }, 60);
}

function fitToDay(day){
  const items = DATA[day];
  const pts = [];
  items.forEach(item=>{
    if(item.lat) pts.push([item.lat,item.lng]);
    if(item.options) item.options.forEach(o=>{ if(o.lat) pts.push([o.lat,o.lng]); });
  });
  if(pts.length) map.fitBounds(pts, {padding:[26,26]});
}

function resetMapView(){
  fitToDay(currentDay);
  document.querySelectorAll('.card.hl').forEach(r=>r.classList.remove('hl'));
  Object.entries(markerRefs).forEach(([k,m])=>{
    const el = m.getElement();
    if(el){ const pin = el.querySelector('.pin'); if(pin) pin.classList.remove('active'); }
  });
}

function focusMarker(key){
  Object.entries(markerRefs).forEach(([k,m])=>{
    const el = m.getElement();
    if(el){ const pin = el.querySelector('.pin'); if(pin) pin.classList.toggle('active', k===key); }
  });
  const m = markerRefs[key];
  if(m){ map.flyTo(m.getLatLng(), 14, {duration:.6}); }
}

function onMarkerClick(key){
  focusMarker(key);
  highlightRow(key);
  const el = document.getElementById('row_'+key);
  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
}

/* ===================== 상세 팝업 ===================== */
function openSheet(key){
  const ref = idToItem[key];
  let d, name;
  if(ref.kind==='item'){
    const item = DATA[ref.day][ref.iIdx];
    d = item.detail; name = item.title;
  } else {
    const opt = DATA[ref.day][ref.iIdx].options[ref.oIdx];
    d = opt; name = opt.name;
  }
  const gsearchQ = encodeURIComponent(name + (d.addr?(' '+d.addr):''));
  document.getElementById('sheetTitle').textContent = name;
  let html = `<div class="badgeRow">`;
  if(d.rate && d.rate!=='-') html += `<span class="pill rate">★ ${d.rate}${d.reviews?(' ('+d.reviews.toLocaleString()+')'):''}</span>`;
  if(d.price) html += `<span class="pill price">${d.price}</span>`;
  html += `</div>`;
  html += renderDetailMedia(name);
  if(d.desc) html += `<div class="desc">${d.desc}</div>`;
  if(d.menu) html += `<div class="kv"><div class="k">대표메뉴</div><div class="v">${d.menu}</div></div>`;
  if(d.addr) html += `<div class="kv"><div class="k">주소</div><div class="v">${d.addr}</div></div>`;
  if(d.phone && d.phone!=='-') html += `<div class="kv"><div class="k">전화</div><div class="v">${d.phone}</div></div>`;
  if(d.reason) html += `<div class="reason"><b>추천 이유</b><br>${d.reason}</div>`;
  if(d.url) html += `<a class="gmap" href="${d.url}" target="_blank" style="margin-bottom:9px;">🏠 에어비앤비에서 보기 ↗</a>`;
  if(d.blog) html += `<a class="gmap" href="${d.blog}" target="_blank" style="margin-bottom:9px;">📝 네이버 블로그 후기 보기 ↗</a>`;
  if(!d.url) html += `<a class="gmap" href="https://www.google.com/search?q=${gsearchQ}" target="_blank">구글에서 검색해보기 ↗</a>`;
  html += `<button class="confirmBtn" onclick="closeSheet()">확인했어요, 목록으로</button>`;
  document.getElementById('sheetBody').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
  initTourGallery();
}
function closeSheet(){ document.getElementById('overlay').classList.remove('show'); }

/* ===================== 일정 복사 기능 (2번 아이디어 적용) ===================== */
function copySchedule(){
  let text = '🎂 칠순기념 강원도 가족여행 일정표 🌲\n\n';
  [1,2,3].forEach(day=>{
    text += `[${DAYNAME[day]}]\n`;
    DATA[day].forEach(item=>{
      if(item.t==='depart'){
        text += `- ${item.team} 출발 ${item.time} (${item.dist}, ${item.dur})\n`;
      } else if(item.t==='move'){
        text += `  → 이동: ${item.title}${item.note?(' / '+item.note):''}\n`;
      } else {
        text += `- ${item.time} ${item.icon||''} ${item.title}${item.sub?(' : '+item.sub):''}\n`;
      }
    });
    text += '\n';
  });
  const done = () => showToast('일정이 클립보드에 복사됐습니다! 카톡에 붙여넣어보세요.');
  const fail = () => showToast('복사에 실패했습니다. 화면을 길게 눌러 직접 복사해주세요.');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(fail);
  } else {
    try{
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      done();
    }catch(e){ fail(); }
  }
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ===================== 탭 전환 ===================== */
function showDay(day){
  currentDay = day;
  [1,2,3].forEach(d=>document.getElementById('tab'+d).classList.toggle('active', d===day));
  renderDay(day);
  buildMap(day);
  document.getElementById('list').scrollTop = 0;
}

/* ===================== 초기 실행 ===================== */
window.addEventListener('load', ()=>{
  initLeaflet();
  showDay(1);
});
</script>
